<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#100A07;color:var(--cream)}
.glow{position:absolute;right:-160px;top:260px;width:900px;height:900px;border-radius:50%;
