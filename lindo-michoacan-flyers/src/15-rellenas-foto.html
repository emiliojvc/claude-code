<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#F9C6D1;color:var(--choco)}
.photo{position:absolute;left:0;top:20px;width:1080px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%)}
.badge{position:absolute;top:56px;right:56px;width:150px;height:150px;border-radius:38px;background:#000 url(../assets/logo-negro.jpg) center/96% no-repeat;box-shadow:0 14px 30px rgba(120,30,60,.25)}
.kick{position:absolute;top:70px;left:64px;background:var(--choco);color:#F9C6D1;font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;padding:12px 22px;border-radius:999px}
h1{position:absolute;top:140px;left:60px;font-size:116px;line-height:.9}
h1 .g{background:linear-gradient(180deg,#F2771F 0%,#D7261E 100%);-webkit-background-clip:text;color:transparent}
.band{position:absolute;left:40px;right:40px;bottom:40px;height:150px;border-radius:36px;background:var(--choco);color:var(--cream);display:flex;align-items:center}
.f{flex:1;display:flex;align-items:center;gap:16px;padding:0 26px}
.f + .f{border-left:1px solid rgba(255,246,230,.15)}
.dot{flex:none;width:30px;height:30px;border-radius:50%;border:4px solid}
.f h3{font-size:30px;line-height:1}
.f p{font-size:20px;margin-top:6px;color:rgba(255,246,230,.75)}
.f p b{color:var(--cream)}
</style></head><body>
<img class="photo" src="../assets/rellenas.png">
<div class="kick">Nuevos sabores</div>
<h1 class="display">¡Ahora<br><span class="g">rellenas!</span></h1>
<div class="badge"></div>
<div class="band">
 <div class="f"><span class="dot" style="background:#FFF4DE;border-color:#5A3423"></span><div><h3 class="display">Nutella</h3><p>rellena de <b>lechera</b></p></div></div>
 <div class="f"><span class="dot" style="background:#B5621C;border-color:#F4E4C1"></span><div><h3 class="display">Vainilla</h3><p>rellena de <b>cajeta</b></p></div></div>
 <div class="f"><span class="dot" style="background:#D7263D;border-color:#F4E4C1"></span><div><h3 class="display">Vainilla</h3><p>rellena de <b>fresa</b></p></div></div>
</div>
</body></html>
