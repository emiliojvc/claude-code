<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:var(--choco);color:var(--cream)}
.half{position:absolute;inset:0;background:var(--yellow);clip-path:polygon(0 0,58% 0,42% 100%,0 100%)}
h1{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:96px}
h1 .a{color:var(--choco)} h1 .b{color:var(--cream)}
.cut{position:absolute;left:50%;top:300px;width:900px;margin-left:-450px;filter:drop-shadow(0 40px 40px rgba(0,0,0,.45))}
.l,.r{position:absolute;bottom:150px;font-size:64px}
.l{left:64px;color:var(--choco)} .r{right:64px;color:var(--yellow)}
.mini{position:absolute;bottom:80px;font-weight:700;font-size:24px;letter-spacing:.18em;text-transform:uppercase}
.mini.l2{left:68px;color:var(--choco)} .mini.r2{right:68px;color:var(--cream);opacity:.7}
.logo{position:absolute;left:50%;bottom:56px;margin-left:-55px;width:110px;height:110px;border-radius:28px}
</style></head><body>
<div class="half"></div>
<h1 class="display"><span class="a">¿Cuál</span> <span class="b">eliges?</span></h1>
<img class="cut" src="../cutouts/duo-sticker.png">
<div class="l display">Cacahuate</div><div class="r display">Coco</div>
<div class="mini l2">Crujiente</div><div class="mini r2">Tropical</div>
<div class="logo"></div>
</body></html>
